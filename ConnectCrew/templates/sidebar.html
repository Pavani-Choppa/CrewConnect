<aside class="sidebar">

    <!-- Logo -->
    <div class="logo">
        <i class="bi bi-people-fill"></i>
        <span>CrewConnect</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}"
           class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>

        </a>


        <!-- ============================
             EMPLOYEES
        ============================= -->

        <div class="nav-section">

            <!-- Employees Parent -->
            <div class="nav-item {% if request.resolver_match.url_name == 'employee_create' or request.resolver_match.url_name == 'employee_list' %}active{% endif %}">

                <div class="nav-item-left">

                    <i class="bi bi-people"></i>
                    <span>Employees</span>

                </div>

                <i class="bi bi-chevron-down"></i>

            </div>


            <div class="submenu">

                <!-- Add Employee -->
                <a href="{% url 'employee_create' %}"
                   class="{% if request.resolver_match.url_name == 'employee_create' %}active{% endif %}">

                    <i class="bi bi-person-plus"></i>
                    <span>Add Employee</span>

                </a>


                <!-- View Employees -->
                <a href="{% url 'employee_list' %}"
                   class="{% if request.resolver_match.url_name == 'employee_list' %}active{% endif %}">

                    <i class="bi bi-person-lines-fill"></i>
                    <span>View Employees</span>

                </a>

            </div>

        </div>


        <!-- ============================
             LEAVE APPROVAL
        ============================= -->

        <a href="{% url 'leave_approve' %}"
           class="nav-item {% if request.resolver_match.url_name == 'leave_approve' %}active{% endif %}">

            <i class="bi bi-calendar-check"></i>
            <span>Leave Approval</span>

        </a>


        <!-- ============================
             DEPARTMENTS
        ============================= -->

        <a href="{% url 'department_list' %}"
           class="nav-item {% if request.resolver_match.url_name == 'department_list' %}active{% endif %}">

            <i class="bi bi-building"></i>
            <span>Departments</span>

        </a>


        <!-- ============================
             DESIGNATIONS
        ============================= -->

        <a href="{% url 'designation_list' %}"
           class="nav-item {% if request.resolver_match.url_name == 'designation_list' %}active{% endif %}">

            <i class="bi bi-briefcase"></i>
            <span>Designations</span>

        </a>

    </nav>


    <!-- Logout -->
    <div class="sidebar-footer">

        <a href="{% url 'logout' %}"
           class="nav-item logout">

            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>

        </a>

    </div>

</aside>
